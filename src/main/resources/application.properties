# ============================================================
#  Higher Lower Game - Application Configuration
#  Environment: Development (override per env with profiles)
# ============================================================

# ── Server ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── Application Info ────────────────────────────────────────
spring.application.name=higher-lower-game

# ── PostgreSQL DataSource ────────────────────────────────────
# Override these via environment variables in production:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/higher_lower_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ─────────────────────────────────
# Tuned for a web game with moderate concurrent players
spring.datasource.hikari.pool-name=HigherLowerPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'validate' in production — DB schema managed by Flyway/Liquibase
# 'update' here for development convenience
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Prevent N+1 query issues — always fetch explicitly
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.open-in-view=false

# ── Jackson (JSON serialization) ─────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ── Cache ────────────────────────────────────────────────────
spring.cache.type=simple

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=Higher Lower Game
info.app.description=Guess which item has more monthly searches
info.app.version=1.0.0

# ── Logging ──────────────────────────────────────────────────
logging.level.com.higherlower=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Game Configuration (custom properties) ───────────────────
game.max-comparison-history=50
game.items-min-pool-size=2


# Auth (local dev only -- replace before prod)
JWT_SECRET=local-dev-secret-change-me-32chars-minimum
GOOGLE_CLIENT_ID=PASTE_YOUR_GOOGLE_CLIENT_ID_HERE