# ============================================================
#  SearchWars — Production Configuration (Railway)
#  All secrets injected via environment variables
# ============================================================

# ── Server ──────────────────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL (Railway injects DATABASE_URL) ────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP (Railway free tier — keep pool small) ───────────
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ── Cache ────────────────────────────────────────────────────
spring.cache.type=simple

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Logging (minimal in prod) ────────────────────────────────
logging.level.com.higherlower=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ── Game ─────────────────────────────────────────────────────
game.max-comparison-history=50
game.items-min-pool-size=2
