name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + JPA tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  postgres-upgrade:
    # Production's database predates Flyway. This recreates that state on a real
    # PostgreSQL (V1 schema, no history table), boots the production jar, and checks
    # Flyway baselines it, applies the newer migrations and Hibernate validates.
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: searchwars
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DB_URL: jdbc:postgresql://localhost:5432/searchwars
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      GOOGLE_CLIENT_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create the pre-Flyway schema, as production had it
        run: |
          psql -h localhost -U postgres -d searchwars -v ON_ERROR_STOP=1 -f src/main/resources/db/migration/V1__baseline.sql
          psql -h localhost -U postgres -d searchwars -v ON_ERROR_STOP=1 -c \
            "insert into items (id, title, image_url, search_volume, category, active) values
               ('legacy-1', 'McDonald s', 'x', 1, 'Food', true), ('legacy-2', 'Naruto', 'x', 2, 'Anime', true)"

      - run: mvn -B -DskipTests package

      - name: Boot the production jar and play one round
        run: |
          java -Dspring.profiles.active=prod -jar target/higher-lower-game-1.0.0.jar --wiki.refresh.enabled=false > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
          curl -sf -X POST localhost:8080/api/game/start -H 'Content-Type: application/json' -d '{}' | grep -q sessionId

      - name: Check migrations ran against the baselined schema
        run: |
          psql -h localhost -U postgres -d searchwars -tAc "select string_agg(version, ',' order by installed_rank) from flyway_schema_history" | tee /dev/stderr | grep -qx '1,2,3'
          psql -h localhost -U postgres -d searchwars -tAc "select title from items where id = 'legacy-1'" | grep -qx "McDonald's"

      - name: App log
        if: always()
        run: cat app.log
