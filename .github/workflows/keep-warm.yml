name: Keep warm

# Render's free plan sleeps the API after 15 min without traffic, and a cold boot takes
# ~2-3 min. Pinging every 5 min keeps it awake while people play: 06:30-01:30 IST
# (01:00-19:55 UTC). Nights are left to sleep so this service uses ~590 of the
# workspace's 750 free instance-hours a month, leaving room for the other services.
# A failed ping fails the run, and GitHub emails the repo owner: a free uptime alert.
on:
  schedule:
    - cron: '*/5 1-19 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the API (waits through a cold boot)
        run: curl -fsS --retry 5 --retry-delay 30 --retry-all-errors --max-time 240 https://searchwars-backend.onrender.com/actuator/health
